<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Alfrend Gulo</title>
    <!-- Memuat Font Awesome untuk ikon sosial media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121816;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-wrapper {
            background: linear-gradient(135deg, #0d3b32 0%, #06241f 100%);
            width: 100%;
            max-width: 1100px;
            border-radius: 24px;
            padding: 40px 60px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Navigasi */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: #b0c4bc;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #ffffff;
        }

        /* Bagian Utama / Hero */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            padding-bottom: 30px;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .hero-text p {
            color: #a3c1ad;
            font-size: 1rem;
            margin-bottom: 30px;
            max-width: 450px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background-color: #00e676;
            color: #06241f;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 40px;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background-color: #00c853;
            transform: translateY(-2px);
        }

        /* Sosial Media */
        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-icons a:hover {
            background-color: #00e676;
            border-color: #00e676;
            color: #06241f;
        }

        /* Foto Profil Lingkaran */
        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-container {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 8px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Responsif untuk HP */
        @media (max-width: 768px) {
            .card-wrapper {
                padding: 20px;
            }
            nav {
                display: none;
            }
            .hero {
                flex-direction: column-reverse;
                text-align: center;
            }
            .hero-text h1 {
                font-size: 2.5rem;
            }
            .hero-text p {
                margin: 0 auto 30px auto;
            }
            .social-icons {
                justify-content: center;
            }
            .image-container {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>
<body>

    <div class="card-wrapper">
        <!-- Header / Navigasi -->
        <header>
            <div class="logo">My Portfolio</div>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Portfolio</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </header>

        <!-- Bagian Utama -->
        <section class="hero">
            <div class="hero-text">
                <h1>Discover My<br>Creative<br>Portfolio</h1>
                <p>Halo, saya Alfrend Gulo. Mahasiswa Informatika yang antusias dengan pengembangan web, jaringan, dan teknologi.</p>
                <a href="#" class="btn">See My Work</a>
                
                <div class="social-icons">
                    <a href="https://github.com/" target="_blank"><i class="fab fa-github"></i></a>
                    <a href="https://facebook.com/" target="_blank"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="mailto:emailanda@gmail.com"><i class="fas fa-envelope"></i></a>
                </div>
            </div>

            <!-- Foto Lingkaran Kanan -->
            <div class="hero-image">
                <div class="image-container">
                    <!-- Pastikan foto profil Anda berada di dalam folder images dengan nama profil.jpeg -->
                    <img src="images/profil.jpeg" alt="Alfrend Gulo">
                </div>
            </div>
        </section>
    </div>

</body>
</html>
